schema: spec-driven

# Project context（背景注入）— 项目治理铁律（创建任何产物时均注入给 AI）
# 注：勿与 `openspec context` 命令（工作上下文 = 根目录 + 引用 store 集合）混淆，二者同形异义
context: |
  项目治理铁律（改代码前必读，不得凭记忆推断）：
  1. 改代码前先读项目规则层（.project/AGENTS_RULES.md），重建约束上下文。
  2. 诊断问题前必查错误档案（.project/error_registry），按模块与标签检索；
     读完原文并核对前提后再下结论，禁止只读单一证据源。
  3. 决策分三层：当前结论留规则层；结论依据由本变更的提案与设计承载；
     历史时序由变更归档与决策时序文件承载。
     规则层不留逐条依据指针，只保留一条固定指引。
  4. 版本控制与发布隔离分离（两件事，判据不同）：
     · 版本控制：规范区（openspec/）、治理区（.project/）与平台机制目录（.codebuddy/）
       **均纳入版本控制**，治理体系与业务规范须可追溯、可恢复；
     · 发布隔离：三者**均不随发布包分发**，改动不得污染发布区。
  5. 无双写纪律（按任务类别分流，判据是「是否改变对外可观察行为」）：
     · 行为变更任务（改变系统对外能力/契约/输出语义）→ 由规范区变更承载其任务态，
       不登记进任务记录，避免双写；
     · 治理改造任务（不改变对外行为，仅改项目自身治理结构：规范区建设、
       基线化既有契约、流程演练、工具链/环境收敛、方案归档、档案建设）
       → 不在规范区建变更（会污染规范区且违反第 7 条），
       **必须**登记进任务记录的「治理改造」分区，否则将失去载体、随会话丢失。
     规则层不复制规范区正文；运行参考与行为说明书之间只留指针，不复制正文。
  6. 会话恢复时：读任务记录（**含治理改造分区**）并列出行中的变更，
     两者合并为当前待办。治理改造类任务只存在于任务记录，规范区中查不到，
     恢复时不得只查规范区就下结论。
  7. 不为未改动的模块补写说明书；文档由真实改动驱动累积。
     （注：「基线化」是把既有契约搬入规范区，不构成补写未改动模块的说明书。）

# Per-artifact rules — 各产物的硬性约束
rules:
  proposal:
    - 建变更前先做任务类别判定（判据：是否改变对外可观察行为），分流规则遵 `.project/AGENTS_RULES.md#治理执行清单（薄层）` A 小节；治理改造类任务**不得**在此建变更
    - 写明「本次是否触及历史错误（ERR 编号）」，无则写「无」
    - 显式列出范围与非目标（不做什么）
  specs:
    - 书写三层与强度算子封闭词表遵 `agent_spec_writing_standard.md#书写分层（形式标记 / 标识符 / 自然语言）`；增量标记与章节结构等本工作流专属写法遵 `openspec_governance_spec.md#行为规范.写法`，本处均不重复定义
    - 历史归档（`changes/archive/`）保持归档时原貌，不因词表更新回改
    - 用增量标记只写本次变化，不重写无关内容
    - 不写类名、函数名、框架选型与实现步骤（归设计与任务文件）
  design:
    - 写技术方案与取舍理由，不复制需求内容
  tasks:
    - 首条固定为「读项目规则层 + 按模块或标签查错误档案」
    - 步骤须可独立完成，完成后立即打勾（中断后从勾选状态续跑）
    - 归档前自检项与初筛命令遵 `.project/AGENTS_RULES.md#治理执行清单（薄层）` C 小节

# Per-operation guidance — apply / archive 的挂接动作
operations:
  apply:
    guidance:
      - 改代码前先读规则层；与既有规则冲突时先更新规则再改代码
      - 发现新问题即时写入错误档案，不事后补记
  archive:
    guidance:
      - 归档前按 `.project/AGENTS_RULES.md#治理执行清单（薄层）` C 小节逐项自检（任务全勾 / validate --strict / 无 TBD 占位 / 回归退出码 0），任一项未过不得归档
      - 归档后同步规则层当前结论（行为类结论进规范区说明书）；
        非变更类决策追加到决策时序文件
      - 不回写任务记录；规则层不留逐条依据指针
      - 变更完成后重跑项目一键回归入口，退出码 0 方可视为完成
